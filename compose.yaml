services:
  postgres:
    container_name: fast-clean-postgres
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "test"
    ports:
      - "5432:5432"
    healthcheck:
      interval: 10s
      retries: 10
      timeout: 5s
      test: "pg_isready -U postgres"

  minio:
    container_name: fast-clean-minio
    image: minio/minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: "admin"
      MINIO_ROOT_PASSWORD: "12345678"
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]

  redis:
    container_name: fast-clean-redis
    image: redis:latest
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
